<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradlink – Find trusted tradespeople in Port Moresby</title>
<meta name="description" content="Find reliable carpenters, plumbers, electricians and more near you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213d;
    --ink-soft: #4a5570;
    --paper: #f1f4f7;
    --card: #ffffff;
    --line: #d9e0e8;
    --sun: #f2b705;
    --verified: #0f7b6c;
    --verified-bg: #e1f3ef;
    --alert: #b3261e;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  header {
    background: var(--ink);
    color: #fff;
    padding: 28px 20px 56px;
    border-bottom: 6px solid var(--sun);
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-family: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 8vw, 3rem);
    line-height: 1.05;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  header p { margin: 0; color: #cfd8ea; max-width: 34em; }
  main { padding: 0 20px 48px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-top: -34px;
    box-shadow: 0 6px 18px rgba(20, 33, 61, 0.08);
  }
  label.field { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
  input[type="search"], select {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }
  input[type="search"]:focus-visible, select:focus-visible,
  button:focus-visible, a:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 2px;
  }
  .row { display: grid; gap: 12px; margin-top: 12px; }
  @media (min-width: 560px) { .row { grid-template-columns: 1fr 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    font: inherit;
    font-size: 0.9rem;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-weight: 500; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--verified); }
  .count { margin: 22px 2px 10px; color: var(--ink-soft); font-size: 0.95rem; }
  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .person {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 6px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .person.is-verified { border-left-color: var(--verified); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .name {
    font-family: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.2rem;
    line-height: 1.2;
    margin: 0;
  }
  .trade { margin: 2px 0 0; font-weight: 600; color: var(--ink-soft); }
  .badge {
    flex: none;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--verified-bg);
    color: var(--verified);
  }
  .badge.unverified { background: #eef0f3; color: var(--ink-soft); }
  .meta { margin: 10px 0 0; color: var(--ink-soft); font-size: 0.95rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn {
    display: inline-block;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    background: #fff;
  }
  .btn.primary { background: var(--sun); border-color: var(--sun); }
  .state {
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 24px 18px;
    text-align: center;
    color: var(--ink-soft);
  }
  .state strong { display: block; color: var(--ink); margin-bottom: 4px; }
  footer { text-align: center; color: var(--ink-soft); font-size: 0.85rem; padding: 0 20px 36px; }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8edf6;
      --ink-soft: #a9b4c8;
      --paper: #0e1626;
      --card: #172238;
      --line: #2b3a57;
      --verified: #5fd0bd;
      --verified-bg: #153a3a;
    }
    header { background: #0a111f; color: #fff; }
    header p { color: #b9c5dd; }
    input[type="search"], select, .chip, .btn { background: var(--card); }
    .chip[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: #14213d; }
    .btn { border-color: var(--line); }
    .btn.primary { color: #14213d; border-color: var(--sun); }
    .badge.unverified { background: #222f48; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Tradlink</h1>
    <p>Find reliable carpenters, plumbers, electricians and other tradespeople in Port Moresby.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="panel" aria-label="Search and filters">
      <label class="field" for="q">Search by name, trade or area</label>
      <input id="q" type="search" placeholder="For example: plumber, Gerehu" autocomplete="off">

      <div class="row">
        <div>
          <label class="field" for="area">Area</label>
          <select id="area"><option value="">All areas</option></select>
        </div>
        <div>
          <label class="field" for="years">Experience</label>
          <select id="years">
            <option value="0">Any experience</option>
            <option value="3">3+ years</option>
            <option value="5">5+ years</option>
            <option value="10">10+ years</option>
          </select>
        </div>
      </div>

      <div class="chips" id="chips" role="group" aria-label="Filter by trade"></div>

      <label class="toggle">
        <input type="checkbox" id="verifiedOnly">
        Show verified tradespeople only
      </label>
    </section>

    <p class="count" id="count" aria-live="polite"></p>
    <ul class="list" id="list"></ul>
  </div>
</main>

<footer>
  <div class="wrap">Tradlink is a new directory. Always agree on the price and the work before the job starts.</div>
</footer>

<script>
  // 1. Paste your published Google Sheet CSV link between the quotes below.
  const CSV_URL = "PASTE_YOUR_CSV_LINK_HERE";

  const $ = (id) => document.getElementById(id);
  let people = [];
  let activeTrade = "";

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else if (c === '"') { inQuotes = true; }
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.some((v) => v.trim() !== "")) rows.push(row);
        row = [];
      } else { field += c; }
    }
    row.push(field);
    if (row.some((v) => v.trim() !== "")) rows.push(row);
    return rows;
  }

  function toPeople(rows) {
    if (rows.length < 2) return [];
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const idx = (key) => head.indexOf(key);
    const col = { name: idx("name"), trade: idx("trade"), area: idx("area"), phone: idx("phone"),
                  email: idx("email"), years: idx("years"), verified: idx("verified") };
    const get = (r, i) => (i >= 0 && r[i] !== undefined ? r[i].trim() : "");
    return rows.slice(1).map((r) => ({
      name: get(r, col.name),
      trade: get(r, col.trade),
      area: get(r, col.area),
      phone: get(r, col.phone),
      email: get(r, col.email),
      years: parseInt(get(r, col.years), 10) || 0,
      verified: /^(yes|y|true|1|verified|✓|✔)$/i.test(get(r, col.verified))
    })).filter((p) => p.name);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function waNumber(phone) {
    let d = phone.replace(/\D/g, "");
    if (!d) return "";
    if (d.startsWith("675")) return d;
    return "675" + d.replace(/^0+/, "");
  }

  function fillFilters() {
    const trades = [...new Set(people.map((p) => p.trade).filter(Boolean))].sort();
    const areas = [...new Set(people.map((p) => p.area).filter(Boolean))].sort();
    $("chips").innerHTML =
      `<button class="chip" type="button" data-trade="" aria-pressed="true">All trades</button>` +
      trades.map((t) => `<button class="chip" type="button" data-trade="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join("");
    $("area").innerHTML = `<option value="">All areas</option>` +
      areas.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`).join("");
  }

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const area = $("area").value;
    const minYears = parseInt($("years").value, 10);
    const verifiedOnly = $("verifiedOnly").checked;

    const results = people.filter((p) => {
      if (activeTrade && p.trade !== activeTrade) return false;
      if (area && p.area !== area) return false;
      if (p.years < minYears) return false;
      if (verifiedOnly && !p.verified) return false;
      if (q && !(`${p.name} ${p.trade} ${p.area}`.toLowerCase().includes(q))) return false;
      return true;
    }).sort((a, b) => (b.verified - a.verified) || (b.years - a.years) || a.name.localeCompare(b.name));

    $("count").textContent = results.length === 1 ? "1 tradesperson found" : results.length + " tradespeople found";

    if (!results.length) {
      $("list").innerHTML = `<li class="state"><strong>No one matches yet</strong>Try a different trade or area, or turn off the verified filter.</li>`;
      return;
    }

    $("list").innerHTML = results.map((p) => {
      const tel = p.phone.replace(/[^\d+]/g, "");
      const wa = waNumber(p.phone);
      const bits = [];
      if (p.area) bits.push(esc(p.area));
      if (p.years) bits.push(p.years + (p.years === 1 ? " year" : " years") + " of experience");
      return `
        <li class="person ${p.verified ? "is-verified" : ""}">
          <div class="top">
            <div>
              <h2 class="name">${esc(p.name)}</h2>
              <p class="trade">${esc(p.trade || "Tradesperson")}</p>
            </div>
            <span class="badge ${p.verified ? "" : "unverified"}">${p.verified ? "Verified" : "Not yet verified"}</span>
          </div>
          ${bits.length ? `<p class="meta">${bits.join(", ")}</p>` : ""}
          <div class="actions">
            ${tel ? `<a class="btn primary" href="tel:${esc(tel)}">Call</a>` : ""}
            ${wa ? `<a class="btn" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
            ${p.email ? `<a class="btn" href="mailto:${esc(p.email)}">Email</a>` : ""}
          </div>
        </li>`;
    }).join("");
  }

  function showMessage(title, text) {
    $("count").textContent = "";
    $("list").innerHTML = `<li class="state"><strong>${title}</strong>${text}</li>`;
  }

  async function load() {
    if (CSV_URL.startsWith("PASTE_")) {
      showMessage("Almost there", "Open index.html and paste your published Google Sheet CSV link where it says PASTE_YOUR_CSV_LINK_HERE.");
      return;
    }
    showMessage("Loading", "Getting the latest tradespeople.");
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error("Bad response");
      people = toPeople(parseCSV(await res.text()));
      fillFilters();
      render();
    } catch (e) {
      showMessage("Could not load the list", "Check your connection and try again. If it keeps happening, the sheet link may need to be published again.");
    }
  }

  $("q").addEventListener("input", render);
  $("area").addEventListener("change", render);
  $("years").addEventListener("change", render);
  $("verifiedOnly").addEventListener("change", render);
  $("chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    activeTrade = b.dataset.trade;
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
    render();
  });

  load();
</script>
</body>
</html>
